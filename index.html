<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>複利投資試算機</title>
    <!-- 引入 html2pdf.js 用於將網頁內容匯出為 PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5f7;
            padding: 20px 0;
        }

        .card {
            background: white;
            padding: 2.5rem 1.5rem;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            width: 92%;
            max-width: 500px;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            color: #1d1d1f;
            text-align: center;
        }

        label {
            font-size: 14px;
            color: #6e6e73;
            font-weight: 600;
            display: block;
            margin-top: 10px;
        }

        select, input {
            width: 100%;
            padding: 12px;
            margin: 6px 0 12px 0;
            box-sizing: border-box;
            border: 1px solid #d2d2d7;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            background-color: white;
        }

        select:focus, input:focus {
            border-color: #0071e3;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        button {
            flex: 1;
            padding: 14px 6px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-calc { background-color: #0071e3; color: white; }
        .btn-pdf { background-color: #34c759; color: white; }
        .btn-clear { background-color: #ff3b30; color: white; flex: 0.5; }

        button:active { opacity: 0.8; }

        /* 畫面上的紀錄區域 */
        #reportArea {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 允許橫向滑動的滾動外框 */
        .section-box {
            background-color: #f9f9fb;
            border-radius: 12px;
            border: 1px solid #e5e5ea;
            padding: 12px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .report-title {
            text-align: left;
            margin-bottom: 10px;
            font-weight: bold;
            color: #0071e3;
            font-size: 15px;
            border-left: 4px solid #0071e3;
            padding-left: 8px;
        }

        /* 手機畫面歷史紀錄表格 */
        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            white-space: nowrap;
        }

        .history-table th, .history-table td {
            padding: 8px 6px;
            text-align: center;
            border-bottom: 1px solid #e5e5ea;
            white-space: nowrap;
        }

        .history-table th {
            color: #6e6e73;
            font-weight: 600;
            background-color: #efeff4;
        }

        .empty-tip {
            text-align: center;
            color: #8e8e93;
            font-size: 13px;
            padding: 10px 0;
        }

        /* ================= 專屬 Excel 風格 PDF 導出模板 ================= */
        #pdfExportTemplate {
            display: none;
            padding: 15px 20px;
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #333;
            width: 100%;
            box-sizing: border-box;
        }

        .pdf-title-box {
            text-align: center;
            border-bottom: 2px solid #0071e3;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .pdf-main-title {
            font-size: 18px;
            font-weight: bold;
            color: #0071e3;
        }

        .pdf-table-header {
            font-size: 13px;
            font-weight: bold;
            color: #1d1d1f;
            margin-top: 14px;
            margin-bottom: 6px;
        }

        .excel-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            text-align: center;
            margin-bottom: 10px;
            table-layout: fixed;
        }

        .excel-table th {
            background-color: #0071e3;
            color: white;
            padding: 6px 4px;
            border: 1px solid #005bb5;
            font-weight: bold;
            white-space: nowrap;
        }

        .excel-table td {
            padding: 6px 4px;
            border: 1px solid #d2d2d7;
            white-space: nowrap;
        }

        .excel-table tr:nth-child(even) {
            background-color: #f9f9fb;
        }
    </style>
</head>
<body>

<div class="card" id="calculatorCard">
    <h2>複利投資計算機</h2>
    
    <!-- 切換試算模式 -->
    <label for="mode">選擇計算模式</label>
    <select id="mode" onchange="toggleMode()">
        <option value="single">1. 單筆一次性投入</option>
        <option value="monthly">2. 每月定期定額</option>
    </select>
    
    <!-- 輸入欄位 1 (加入自動千分位處理) -->
    <label id="lblNum1" for="num1">一開始投入的本金 (元)</label>
    <input type="text" id="num1" placeholder="例如：100,000" inputmode="decimal" oninput="formatInput(this)">
    
    <!-- 輸入欄位 2 -->
    <label for="rate">預期年投報率 (%)</label>
    <input type="number" id="rate" placeholder="例如：5 表示 5%" step="0.1" inputmode="decimal">

    <!-- 輸入欄位 3 -->
    <label for="years">累積年數 (年)</label>
    <input type="number" id="years" placeholder="例如：10" inputmode="decimal">
    
    <!-- 按鈕組 -->
    <div class="btn-group">
        <button class="btn-calc" onclick="calculate()">計算並新增</button>
        <button class="btn-pdf" onclick="downloadPDF()">下載 PDF 試算表</button>
        <button class="btn-clear" onclick="clearHistory()">清空</button>
    </div>
    
    <!-- 手機端畫面的雙分區紀錄 -->
    <div id="reportArea">
        <!-- 區塊一：單筆一次性投入 -->
        <div class="section-box">
            <div class="report-title">1. 單筆一次性投入紀錄</div>
            <table class="history-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>本金(元)</th>
                        <th>利率</th>
                        <th>年數</th>
                        <th>總投報率</th>
                        <th>期末總額(元)</th>
                    </tr>
                </thead>
                <tbody id="singleHistoryList">
                    <tr><td colspan="6" class="empty-tip">尚無單筆投入紀錄</td></tr>
                </tbody>
            </table>
        </div>

        <!-- 區塊二：每月定期定額（無總投報率） -->
        <div class="section-box">
            <div class="report-title">2. 每月定期定額紀錄</div>
            <table class="history-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>月扣(元)</th>
                        <th>利率</th>
                        <th>年數</th>
                        <th>累積本金(元)</th>
                        <th>期末總額(元)</th>
                    </tr>
                </thead>
                <tbody id="monthlyHistoryList">
                    <tr><td colspan="6" class="empty-tip">尚無定期定額紀錄</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- ================= 隱藏的 PDF 輸出模板 ================= -->
<div id="pdfExportTemplate">
    <div class="pdf-title-box">
        <div class="pdf-main-title">投資複利試算數據彙整表</div>
        <div style="font-size: 10px; color: #666; margin-top: 4px;">產出時間：<span id="pdfPrintDate"></span></div>
    </div>

    <!-- PDF 表格 1：單筆一次性投入 -->
    <div class="pdf-table-header">一、 單筆一次性投入試算明細</div>
    <table class="excel-table">
        <thead>
            <tr>
                <th style="width: 8%;">編號</th>
                <th style="width: 20%;">投入本金</th>
                <th style="width: 14%;">年投報率</th>
                <th style="width: 14%;">累積年數</th>
                <th style="width: 20%;">總投報率</th>
                <th style="width: 24%;">期末總金額</th>
            </tr>
        </thead>
        <tbody id="pdfSingleBody">
            <!-- 插入單筆資料 -->
        </tbody>
    </table>

    <!-- PDF 表格 2：每月定期定額 -->
    <div class="pdf-table-header" style="margin-top: 20px;">二、 每月定期定額試算明細</div>
    <table class="excel-table">
        <thead>
            <tr>
                <th style="width: 8%;">編號</th>
                <th style="width: 20%;">每月扣款額</th>
                <th style="width: 14%;">年投報率</th>
                <th style="width: 14%;">累積年數</th>
                <th style="width: 20%;">累積投入本金</th>
                <th style="width: 24%;">期末總金額</th>
            </tr>
        </thead>
        <tbody id="pdfMonthlyBody">
            <!-- 插入定期定額資料 -->
        </tbody>
    </table>
</div>

<script>
    let singleHistory = [];
    let monthlyHistory = [];

    // 輸入時即時自動加上千分位逗號
    function formatInput(input) {
        // 先移除所有非數字與非小數點的字元
        let cleanVal = input.value.replace(/[^\d.]/g, '');
        if (!cleanVal) {
            input.value = '';
            return;
        }
        // 切分整數與小數部分
        let parts = cleanVal.split('.');
        parts[0] = Number(parts[0]).toLocaleString('en-US'); // 整數部分加逗號
        input.value = parts.join('.');
    }

    function toggleMode() {
        const mode = document.getElementById('mode').value;
        const lblNum1 = document.getElementById('lblNum1');
        if (mode === 'single') {
            lblNum1.innerText = "一開始投入的本金 (元)";
            document.getElementById('num1').placeholder = "例如：100,000";
        } else {
            lblNum1.innerText = "每月定期定額金額 (元)";
            document.getElementById('num1').placeholder = "例如：3,000";
        }
    }

    function calculate() {
        const mode = document.getElementById('mode').value;
        
        // 抓取金額輸入框時，把裡面的逗號去除去做純數字運算
        const rawNum1 = document.getElementById('num1').value.replace(/,/g, '');
        const val1 = parseFloat(rawNum1);
        const rPercent = parseFloat(document.getElementById('rate').value);
        const n = parseFloat(document.getElementById('years').value);

        if (isNaN(val1) || isNaN(rPercent) || isNaN(n) || val1 <= 0 || n <= 0) {
            alert("請填寫正確的數值！");
            return;
        }

        const r = rPercent / 100;
        let totalAmount = 0;
        let totalPrincipal = 0;

        if (mode === 'single') {
            totalPrincipal = val1;
            totalAmount = val1 * Math.pow(1 + r, n);
            const totalReturnRate = ((totalAmount - totalPrincipal) / totalPrincipal) * 100;

            singleHistory.push({
                val1: val1,
                rate: rPercent,
                years: n,
                totalReturnRate: totalReturnRate.toFixed(2) + "%",
                totalAmount: Math.round(totalAmount)
            });
        } else {
            totalPrincipal = val1 * 12 * n;
            totalAmount = ((val1 * 12 * (Math.pow(1 + r, n + 1) - 1)) / r) - (val1 * 12);

            monthlyHistory.push({
                val1: val1,
                rate: rPercent,
                years: n,
                totalPrincipal: Math.round(totalPrincipal),
                totalAmount: Math.round(totalAmount)
            });
        }

        renderHistory();
    }

    function renderHistory() {
        // 1. 單筆表格
        const singleTbody = document.getElementById('singleHistoryList');
        if (singleHistory.length === 0) {
            singleTbody.innerHTML = `<tr><td colspan="6" class="empty-tip">尚無單筆投入紀錄</td></tr>`;
        } else {
            singleTbody.innerHTML = singleHistory.map((item, index) => `
                <tr>
                    <td><b>${index + 1}</b></td>
                    <td>${item.val1.toLocaleString()}</td>
                    <td>${item.rate}%</td>
                    <td>${item.years}年</td>
                    <td>${item.totalReturnRate}</td>
                    <td style="color:#0071e3; font-weight:bold;">${item.totalAmount.toLocaleString()}</td>
                </tr>
            `).join('');
        }

        // 2. 定期定額表格
        const monthlyTbody = document.getElementById('monthlyHistoryList');
        if (monthlyHistory.length === 0) {
            monthlyTbody.innerHTML = `<tr><td colspan="6" class="empty-tip">尚無定期定額紀錄</td></tr>`;
        } else {
            monthlyTbody.innerHTML = monthlyHistory.map((item, index) => `
                <tr>
                    <td><b>${index + 1}</b></td>
                    <td>${item.val1.toLocaleString()}</td>
                    <td>${item.rate}%</td>
                    <td>${item.years}年</td>
                    <td>${item.totalPrincipal.toLocaleString()}</td>
                    <td style="color:#0071e3; font-weight:bold;">${item.totalAmount.toLocaleString()}</td>
                </tr>
            `).join('');
        }
    }

    function clearHistory() {
        if (singleHistory.length === 0 && monthlyHistory.length === 0) return;
        if (confirm("確定要清空所有紀錄嗎？")) {
            singleHistory = [];
            monthlyHistory = [];
            renderHistory();
        }
    }

    function downloadPDF() {
        if (singleHistory.length === 0 && monthlyHistory.length === 0) {
            alert("目前尚無任何計算紀錄，請先計算至少一筆數值！");
            return;
        }

        document.getElementById('pdfPrintDate').innerText = new Date().toLocaleString('zh-TW');
        
        // 渲染 PDF 單筆表格
        const pdfSingleBody = document.getElementById('pdfSingleBody');
        if (singleHistory.length === 0) {
            pdfSingleBody.innerHTML = `<tr><td colspan="6" style="color:#999; padding:8px;">無單筆試算紀錄</td></tr>`;
        } else {
            pdfSingleBody.innerHTML = singleHistory.map((item, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td>$${item.val1.toLocaleString()}</td>
                    <td>${item.rate}%</td>
                    <td>${item.years}年</td>
                    <td style="color:#d9534f; font-weight:bold;">${item.totalReturnRate}</td>
                    <td style="color:#0071e3; font-weight:bold;">$${item.totalAmount.toLocaleString()}</td>
                </tr>
            `).join('');
        }

        // 渲染 PDF 定期定額表格
        const pdfMonthlyBody = document.getElementById('pdfMonthlyBody');
        if (monthlyHistory.length === 0) {
            pdfMonthlyBody.innerHTML = `<tr><td colspan="6" style="color:#999; padding:8px;">無定期定額試算紀錄</td></tr>`;
        } else {
            pdfMonthlyBody.innerHTML = monthlyHistory.map((item, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td>$${item.val1.toLocaleString()}</td>
                    <td>${item.rate}%</td>
                    <td>${item.years}年</td>
                    <td>$${item.totalPrincipal.toLocaleString()}</td>
                    <td style="color:#0071e3; font-weight:bold;">$${item.totalAmount.toLocaleString()}</td>
                </tr>
            `).join('');
        }

        // 顯示 PDF 模板進行渲染
        const element = document.getElementById('pdfExportTemplate');
        element.style.display = 'block';

        const opt = {
            margin:       [8, 8, 8, 8],
            filename:     '投資複利分項試算表.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, scrollY: 0 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' },
            pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            element.style.display = 'none';
        });
    }
</script>

</body>
</html>
